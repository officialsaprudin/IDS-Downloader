<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>IDS Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="logo">
        <img src="icons/icon48.png" style="width: 22px; height: 22px; border-radius: 5px; object-fit: cover;">
        <span>IDS Downloader</span>
      </div>
      <span id="status-badge" class="badge checking">Memeriksa...</span>
    </div>

    <div class="popup-body">
      <p class="description">
        Ekstensi aktif. Tombol unduh otomatis muncul di atas video YouTube.
      </p>

      <div class="field-group">
        <label>Unduh Tautan Cepat:</label>
        <input type="text" id="quick-url" placeholder="https://youtube.com/watch?v=... atau URL file">
      </div>

      <div class="field-row">
        <select id="quick-res">
          <optgroup label="Video (MP4)">
            <option value="1080p">1080p Full HD (MP4)</option>
            <option value="720p" selected>720p HD (MP4)</option>
            <option value="480p">480p Standar (MP4)</option>
            <option value="360p">360p Ringan (MP4)</option>
          </optgroup>
          <optgroup label="Audio / Musik (MP3)">
            <option value="mp3">Audio MP3 HQ (320kbps)</option>
            <option value="mp3-std">Audio MP3 Standar (128kbps)</option>
            <option value="m4a">Audio M4A (Original AAC)</option>
            <option value="wav">Audio WAV Lossless</option>
          </optgroup>
          <optgroup label="Lainnya">
            <option value="best">Kualitas Terbaik Otomatis</option>
          </optgroup>
        </select>
        <button id="btn-quick-download">Unduh</button>
      </div>

      <div id="result-msg" class="result-msg"></div>

      <a id="btn-open-app" href="http://127.0.0.1:48912" target="_blank" class="app-link">
        Buka Aplikasi IDS Desktop ↗
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
